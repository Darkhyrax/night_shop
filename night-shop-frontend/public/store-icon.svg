<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo -->
  <rect width="100" height="100" fill="#1976d2" rx="10"/>
  
  <!-- Tienda -->
  <g fill="#ffffff">
    <!-- Techo/Toldo -->
    <polygon points="20,40 50,20 80,40" fill="#ff9800"/>
    
    <!-- Puerta principal -->
    <rect x="35" y="50" width="30" height="40" fill="#d4a574" stroke="#8b6f47" stroke-width="1"/>
    
    <!-- Manija de puerta -->
    <circle cx="62" cy="70" r="2" fill="#8b6f47"/>
    
    <!-- Ventana izquierda -->
    <rect x="22" y="52" width="10" height="10" fill="#87ceeb" stroke="#4a90e2" stroke-width="0.5"/>
    <line x1="27" y1="52" x2="27" y2="62" stroke="#4a90e2" stroke-width="0.5"/>
    <line x1="22" y1="57" x2="32" y2="57" stroke="#4a90e2" stroke-width="0.5"/>
    
    <!-- Ventana derecha -->
    <rect x="68" y="52" width="10" height="10" fill="#87ceeb" stroke="#4a90e2" stroke-width="0.5"/>
    <line x1="73" y1="52" x2="73" y2="62" stroke="#4a90e2" stroke-width="0.5"/>
    <line x1="68" y1="57" x2="78" y2="57" stroke="#4a90e2" stroke-width="0.5"/>
    
    <!-- Base/Pared -->
    <rect x="20" y="40" width="60" height="50" fill="#d4a574" stroke="#8b6f47" stroke-width="1"/>
  </g>
</svg>
