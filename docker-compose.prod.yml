version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: night_shop_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER:-nightshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nightshop123}
      POSTGRES_DB: ${DB_NAME:-night_shop_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nightshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - night_shop_network

  backend:
    image: ghcr.io/Darkhyrax/night-shop-backend:latest
    container_name: night_shop_backend_prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-nightshop}
      DB_PASSWORD: ${DB_PASSWORD:-nightshop123}
      DB_NAME: ${DB_NAME:-night_shop_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - night_shop_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/Darkhyrax/night-shop-frontend:latest
    container_name: night_shop_frontend_prod
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    restart: always
    networks:
      - night_shop_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  night_shop_network:
    driver: bridge
